# The empty canary: people adopting at different times. A Claudinite engine
# release dispatches it with the version it just published. It waits until
# npm serves that version, then adopts this empty repo with it from npm on a
# throwaway branch, the real bootstrap a new member runs, and passes when the
# installer's update right after finds nothing newer and cn verify, cn
# selftest --repo and cn check world are all clean. A second adoption starts
# from a ci.yml that runs on push only. The upgrade matrix takes Lagging's
# main as it stood at each of the last three stable versions it pinned and
# at the oldest version any canary holds, and passes when the installer's
# update moves each to this version with selftest clean and no new finding.
# The encrypted and handover jobs play the session history scenarios: a
# single repo with its own key secret, and one without. The first pushes and
# deletes a branch; the second files and closes one issue.
# Apart from those two it pushes nothing. When it fails, the report job opens
# a release-blocker issue naming the version in this repo, or comments on the one already
# open, which holds the release back from promotion to stable.
name: canary

on:
  workflow_dispatch:
    inputs:
      version:
        description: The @claudinite/cli version to adopt, MAJOR.YMMDD.BUILD
        required: true
        type: string

permissions: {}

concurrency:
  group: canary-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: the version is MAJOR.YMMDD.BUILD
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.YMMDD.BUILD, not \"$VERSION\""
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # npm lists a version minutes before its CDN serves the tarballs, so
      # this waits on the tarballs npx and the launcher download.
      - name: wait until npm serves the version
        run: |
          registry=https://registry.npmjs.org/@claudinite
          for _ in $(seq 1 90); do
            if curl -fsSI -o /dev/null "$registry/cli/-/cli-$VERSION.tgz" \
              && curl -fsSI -o /dev/null "$registry/cli-linux-x64/-/cli-linux-x64-$VERSION.tgz"; then
              echo "npm serves @claudinite/cli@$VERSION"
              exit 0
            fi
            sleep 20
          done
          echo "::error::npm did not serve @claudinite/cli@$VERSION within 30 minutes"
          exit 1
      - name: adopt from npm on a throwaway branch
        id: adopt
        run: |
          git switch -c "canary/$VERSION"
          npx --yes "@claudinite/cli@$VERSION" adopt basics --channel staging
      # adopt pins the newest staging version, which is this one unless a
      # newer release went out first.
      - name: the adoption pinned this version
        run: |
          pinned=$({ npx --yes @claudinite/setup@1.0.1 >&2 && .claudinite/bin/cn version; } | sed -n 1p)
          if [ "$pinned" != "$VERSION" ]; then
            echo "::error::the adoption pinned $pinned, not $VERSION"
            exit 1
          fi
      # Every new member gets a pull_request workflow that runs the checks.
      - name: the adoption added a pull_request check workflow
        if: ${{ !cancelled() && steps.adopt.outcome == 'success' }}
        run: |
          found=$(grep -l 'pull_request' .github/workflows/*.yml 2>/dev/null || true)
          if [ -z "$found" ]; then
            echo "::error::the adoption wrote no workflow that runs on pull_request"
            exit 1
          fi
          echo "$found"
      - name: the installer's update right after finds nothing newer
        if: ${{ !cancelled() && steps.adopt.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx --yes @claudinite/setup@1 update --repo . --dry-run --json > "$RUNNER_TEMP/update.json"
          cat "$RUNNER_TEMP/update.json"
          read -r from to files < <(jq -r '[.from, .to, (.files | length)] | @tsv' "$RUNNER_TEMP/update.json")
          if [ "$from" != "$VERSION" ] || [ "$to" != "$VERSION" ] || [ "$files" != 0 ]; then
            echo "::error::right after adopting $VERSION the update moves $from to $to and writes $files file(s)"
            exit 1
          fi
      - name: cn verify
        if: ${{ !cancelled() && steps.adopt.outcome == 'success' }}
        run: .claudinite/bin/cn verify
      - name: cn selftest --repo
        if: ${{ !cancelled() && steps.adopt.outcome == 'success' }}
        run: .claudinite/bin/cn selftest --repo .
      - name: cn check world
        if: ${{ !cancelled() && steps.adopt.outcome == 'success' }}
        run: .claudinite/bin/cn check world

  push-only-ci:
    needs: canary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: a repo whose ci.yml runs on push only
        run: |
          git switch -c "canary/$VERSION-push-only"
          mkdir -p .github/workflows
          printf '%s\n' 'name: ci' 'on: push' 'jobs:' '  build:' '    runs-on: ubuntu-24.04' '    steps:' '      - run: echo build' > .github/workflows/ci.yml
          git add .github/workflows/ci.yml
      - name: adopt from npm
        run: npx --yes "@claudinite/cli@$VERSION" adopt basics --channel staging
      - name: the adoption added claudinite-check.yml
        run: |
          if [ ! -f .github/workflows/claudinite-check.yml ]; then
            echo "::error::adopting a repo whose ci.yml runs on push only wrote no claudinite-check.yml"
            ls .github/workflows
            exit 1
          fi
          grep -q pull_request .github/workflows/claudinite-check.yml || {
            echo "::error::claudinite-check.yml does not run on pull_request"
            exit 1
          }
      - name: cn check world
        run: |
          npx --yes @claudinite/setup@1.0.1 >&2
          .claudinite/bin/cn check world

  # S-05. A single repo with its own key secret. The secret lives in the
  # claudinite environment, which only main may read, so this job runs from
  # main. The public key file is derived here by a script that shares no code
  # with the engine; a fixture session captured with it must land on
  # encrypted-agent-sessions as ciphertext only and open with the secret.
  encrypted:
    needs: canary
    if: ${{ !cancelled() && needs.canary.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: claudinite
      deployment: false
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      BRANCH: encrypted-agent-sessions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
      - name: adopt from npm on a throwaway branch
        run: |
          git switch -c "canary/$VERSION-encrypted"
          npx --yes "@claudinite/cli@$VERSION" adopt basics --channel staging > /dev/null
          npx --yes @claudinite/setup@1.0.1 > /dev/null
          .claudinite/bin/cn version | sed -n 1p
          sudo apt-get install -y --no-install-recommends age > /dev/null
      - name: S-05 start with no session branch
        run: |
          for b in "$BRANCH" agent-sessions conversation-logs; do
            if git ls-remote --exit-code --heads origin "$b" > /dev/null; then
              echo "::notice::deleting $b, left by an earlier run"
              git push origin --delete "$b"
            fi
          done
      - name: S-05 the secret derives the public key file
        env:
          SESSION_HISTORY_KEY: ${{ secrets.SESSION_HISTORY_KEY }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          if [ -z "$SESSION_HISTORY_KEY" ]; then
            echo "::error::SESSION_HISTORY_KEY is empty in the claudinite environment: add it (Claudinite/Engine#500, M-03)"
            exit 1
          fi
          mkdir -p .claudinite/keys
          python3 scripts/derive_history_key.py "$REPO_ID" .claudinite/keys/conversation-logs.pub "$RUNNER_TEMP/identity.txt"
          echo "::add-mask::$(tail -n 1 "$RUNNER_TEMP/identity.txt")"
          cat .claudinite/keys/conversation-logs.pub
          # check world exits 0 on an advisory, so the finding is what is asserted.
          .claudinite/bin/cn check world > "$RUNNER_TEMP/world.txt" || true
          cat "$RUNNER_TEMP/world.txt"
          if grep -q 'history-key-missing' "$RUNNER_TEMP/world.txt"; then
            echo "::error::cn check world still reports history-key-missing with the public key file committed"
            exit 1
          fi
      - name: S-05 a fixture session lands as ciphertext only
        run: |
          .claudinite/bin/cn growth capture --issue 0 --session "canary-fresh-$VERSION" \
            --transcript canary-fixtures/session.jsonl | tee "$RUNNER_TEMP/capture.txt"
          grep -q "on $BRANCH" "$RUNNER_TEMP/capture.txt" || {
            echo "::error::the capture did not report a file stored on $BRANCH"
            exit 1
          }
          git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null || {
            echo "::error::$BRANCH does not exist on origin after the capture"
            exit 1
          }
          for b in agent-sessions conversation-logs; do
            if git ls-remote --exit-code --heads origin "$b" > /dev/null; then
              echo "::error::the capture created a $b branch"
              exit 1
            fi
          done
          git fetch --quiet origin "$BRANCH"
          files=$(git ls-tree -r --name-only FETCH_HEAD | grep -v '^README.md$')
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qv '\.age$'; then
            echo "::error::$BRANCH holds something that is not an .age file, or nothing: $files"
            exit 1
          fi
          # grep exits 1 on no match, which is the wanted answer here.
          if git grep -q 'canary-fixture-marker' FETCH_HEAD; then
            echo "::error::the fixture's text is readable on $BRANCH"
            exit 1
          fi
          who=$(git log -1 --format=%an FETCH_HEAD)
          if [ "$who" != claudinite-capture ]; then
            echo "::error::the capture was committed as $who, not claudinite-capture"
            exit 1
          fi
      - name: S-05 the secret opens the capture and it matches the fixture
        run: |
          f=$(git ls-tree -r --name-only FETCH_HEAD | grep '\.age$' | head -n 1)
          git show "FETCH_HEAD:$f" | age -d -i "$RUNNER_TEMP/identity.txt" | gunzip > "$RUNNER_TEMP/opened.jsonl"
          # The first line is the capture's own header; the rest is the transcript.
          tail -n +2 "$RUNNER_TEMP/opened.jsonl" | diff - canary-fixtures/session.jsonl || {
            echo "::error::the opened capture differs from the fixture"
            exit 1
          }
          echo "the capture opens with the secret and matches the fixture"
      - name: S-05 delete the branch
        if: ${{ always() }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git push origin --delete "$BRANCH"
          fi

  # S-06. A single repo that never added the secret. Nothing here reads the
  # claudinite environment, and the job may write issues in this repo only
  # for the scheduler and executor run of this scenario. The adopted tasks are
  # all disabled but engine/history-key so the executor has nothing else to do.
  handover:
    needs: canary
    if: ${{ !cancelled() && needs.canary.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TITLE: "[claudinite-work] engine/history-key"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: adopt from npm on a throwaway branch with one task
        run: |
          git switch -c "canary/$VERSION-handover"
          npx --yes "@claudinite/cli@$VERSION" adopt basics --channel staging > /dev/null
          npx --yes @claudinite/setup@1.0.1 > /dev/null
          {
            echo "  disabled:"
            .claudinite/bin/cn check list --tasks | awk '$1 != "engine/history-key" { print "    - " $1 }'
          } > "$RUNNER_TEMP/disabled.yaml"
          awk -v f="$RUNNER_TEMP/disabled.yaml" '{ print } /^tasks:$/ { while ((getline l < f) > 0) print l }' \
            .claudinite/settings.yaml > "$RUNNER_TEMP/settings.yaml"
          mv "$RUNNER_TEMP/settings.yaml" .claudinite/settings.yaml
          .claudinite/bin/cn version | sed -n 1p
      - name: S-06 start with no open history-key item
        run: |
          for n in $(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq ".[] | select(.pull_request == null and .title == \"$TITLE\") | .number"); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason "not planned" \
              --comment "Closed by the canary: an item left by an earlier run."
          done

          # A closed item still wearing its park label is the task's newest
          # run and makes its next item decline; a person's handover ends in done.
          for n in $(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
            --jq ".[] | select(.pull_request == null and .title == \"$TITLE\" and (.labels | map(.name) | any(startswith(\"task:status:needs-human-\")))) | .number"); do
            for l in $(gh api "repos/$GITHUB_REPOSITORY/issues/$n" --jq '.labels[].name | select(startswith("task:status:needs-human-"))'); do
              gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --remove-label "$l" > /dev/null
            done
            gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --add-label task:status:done > /dev/null
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed > /dev/null || true
          done
      - name: S-06 the scheduler files one history-key item
        env:
          CLAUDINITE_WAKE: engine/history-key
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "$started" > "$RUNNER_TEMP/started"
          .claudinite/bin/cn schedule run
          for _ in $(seq 6); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&since=$started&per_page=100" \
              --jq "[.[] | select(.pull_request == null and .title == \"$TITLE\")] | length")
            [ "$n" = 1 ] && break
            sleep 10
          done
          if [ "$n" != 1 ]; then
            echo "::error::the scheduler run filed $n history-key items, not one"
            exit 1
          fi
      - name: S-06 the executor parks it as the handover
        run: |
          .claudinite/bin/cn execute loop
          started=$(cat "$RUNNER_TEMP/started")
          deadline=$((SECONDS + 5 * 60))
          while :; do
            item=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&since=$started&per_page=100" \
              --jq "[.[] | select(.pull_request == null and .title == \"$TITLE\")] | first")
            labels=$(jq -r '[.labels[].name] | join(" ")' <<<"$item")
            case " $labels " in
              *" task:status:needs-human-action "*) break ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the deadline passed before the item was parked as needing a person; it carries: $labels"
              exit 1
            fi
            sleep 10
          done
          number=$(jq -r .number <<<"$item")
          echo "$number" > "$RUNNER_TEMP/item"
          text="$(jq -r .body <<<"$item")
          $(gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" --jq '.[].body')"
          case $text in
            *"/settings/environments"*) ;;
            *)
              echo "::error::the parked item names no link to the repository's environments"
              printf '%s\n' "$text"
              exit 1 ;;
          esac
      - name: S-06 a second scheduler run files nothing new
        run: |
          .claudinite/bin/cn schedule run
          started=$(cat "$RUNNER_TEMP/started")
          sleep 10
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&since=$started&per_page=100" \
            --jq "[.[] | select(.pull_request == null and .title == \"$TITLE\")] | length")
          if [ "$n" != 1 ]; then
            echo "::error::a second scheduler run left $n history-key items, not the one parked"
            exit 1
          fi
      - name: S-06 capture stores nothing and cn check world reports the missing secret
        run: |
          .claudinite/bin/cn growth capture --issue 0 --session "canary-handover-$VERSION" \
            --transcript canary-fixtures/session.jsonl | tee "$RUNNER_TEMP/capture.txt"
          grep -q 'no public key' "$RUNNER_TEMP/capture.txt" || {
            echo "::error::the capture did not say it stored nothing for want of a public key"
            exit 1
          }
          for b in encrypted-agent-sessions agent-sessions conversation-logs; do
            if git ls-remote --exit-code --heads "https://github.com/$GITHUB_REPOSITORY" "$b" > /dev/null; then
              echo "::error::the capture left a $b branch"
              exit 1
            fi
          done
          .claudinite/bin/cn check world > "$RUNNER_TEMP/world.txt" || true
          cat "$RUNNER_TEMP/world.txt"
          grep -q 'history-key-missing' "$RUNNER_TEMP/world.txt" || {
            echo "::error::cn check world did not report history-key-missing"
            exit 1
          }
      - name: S-06 close the parked item
        if: ${{ always() }}
        run: |
          for n in $(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq ".[] | select(.pull_request == null and .title == \"$TITLE\") | .number"); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason "not planned" \
              --comment "Closed by the canary for $VERSION: the scenario is over."
          done

          # A closed item still wearing its park label is the task's newest
          # run and makes its next item decline; a person's handover ends in done.
          for n in $(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
            --jq ".[] | select(.pull_request == null and .title == \"$TITLE\" and (.labels | map(.name) | any(startswith(\"task:status:needs-human-\")))) | .number"); do
            for l in $(gh api "repos/$GITHUB_REPOSITORY/issues/$n" --jq '.labels[].name | select(startswith("task:status:needs-human-"))'); do
              gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --remove-label "$l" > /dev/null
            done
            gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --add-label task:status:done > /dev/null
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed > /dev/null || true
          done

  # The versions people hold: the last three stable versions Lagging's main
  # pinned, and the oldest version any public canary pins today, each with
  # the Lagging commit that first pinned it.
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: pick the versions
        id: pick
        run: |
          git clone -q --filter=blob:none https://github.com/ClaudiniteCanaries/Lagging "$RUNNER_TEMP/lagging"
          cd "$RUNNER_TEMP/lagging"
          pin() { sed -n 's/^  version: "\(.*\)"$/\1/p' | head -n 1; }
          older() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -t. -k1,1n -k2,2n -k3,3n | head -n 1)" = "$1" ]; }
          : > "$RUNNER_TEMP/pins"
          for sha in $(git log --reverse --format=%H -G'^  version: ' origin/HEAD -- .claudinite/settings.yaml); do
            v=$(git show "$sha:.claudinite/settings.yaml" | pin)
            if [ -n "$v" ] && ! grep -q " $v\$" "$RUNNER_TEMP/pins"; then echo "$sha $v" >> "$RUNNER_TEMP/pins"; fi
          done
          latest=$(npm view @claudinite/cli dist-tags.latest)
          stable=$(while read -r sha v; do if [ "$v" = "$latest" ] || older "$v" "$latest"; then echo "$v"; fi; done < "$RUNNER_TEMP/pins" | tail -n 3)
          oldest=""
          for repo in $(gh api "orgs/ClaudiniteCanaries/repos?type=public&per_page=100" --jq '.[] | select(.archived | not) | .full_name'); do
            v=$(curl -fsSL "https://raw.githubusercontent.com/$repo/HEAD/.claudinite/settings.yaml" 2>/dev/null | pin || true)
            if [ -n "$v" ] && { [ -z "$oldest" ] || older "$v" "$oldest"; }; then oldest=$v; fi
          done
          echo "latest $latest; stable pins: $(echo $stable); oldest held: ${oldest:-none}"
          rows=""
          for v in $(printf '%s\n' $stable $oldest | sort -u); do
            older "$v" "$VERSION" || continue
            sha=$(awk -v v="$v" '$2 == v { print $1; exit }' "$RUNNER_TEMP/pins")
            if [ -z "$sha" ]; then
              echo "::notice::Lagging never pinned $v, so the matrix starts nowhere for it"
              continue
            fi
            rows="$rows{\"from\":\"$v\",\"sha\":\"$sha\"},"
          done
          if [ -z "$rows" ]; then
            echo "::error::no version older than $VERSION to upgrade from"
            exit 1
          fi
          echo "matrix={\"include\":[${rows%,}]}" | tee -a "$GITHUB_OUTPUT"

  upgrade:
    needs: [canary, versions]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    name: upgrade from ${{ matrix.from }}
    env:
      VERSION: ${{ inputs.version }}
      FROM: ${{ matrix.from }}
    steps:
      - name: Lagging's main as it stood at the version
        run: |
          git clone -q https://github.com/ClaudiniteCanaries/Lagging "$RUNNER_TEMP/member"
          git -C "$RUNNER_TEMP/member" checkout -q --detach "${{ matrix.sha }}"
      - name: findings before the update
        working-directory: ${{ runner.temp }}/member
        run: |
          npx --yes @claudinite/setup@1
          [ "$(.claudinite/bin/cn version | sed -n 1p)" = "$FROM" ] || { echo "::error::the snapshot does not run $FROM"; exit 1; }
          .claudinite/bin/cn check world > "$RUNNER_TEMP/before.txt" || true
          cat "$RUNNER_TEMP/before.txt"
      - name: the installer's update to the version
        working-directory: ${{ runner.temp }}/member
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDINITE_MANAGER_TOKEN: ${{ secrets.CLAUDINITE_MANAGER_TOKEN }}
        run: |
          # The snapshot names a private manager. Without a token for it the
          # update cannot read the directory, so the snapshot is taken as a
          # member with no manager, which leaves the engine's own update intact.
          if [ -z "$CLAUDINITE_MANAGER_TOKEN" ]; then
            echo "::notice::no CLAUDINITE_MANAGER_TOKEN in this repository: the snapshot's manager is dropped"
            python3 - <<'PY'
          import re
          p = ".claudinite/settings.yaml"
          lines = open(p).read().split("\n")
          out, skip = [], None
          for l in lines:
              if skip is not None:
                  if l.strip() == "" or len(l) - len(l.lstrip()) > skip:
                      continue
                  skip = None
              if re.match(r"^\s+manager:\s*$", l):
                  skip = len(l) - len(l.lstrip())
                  continue
              out.append(l)
          open(p, "w").write("\n".join(out))
          PY
          fi
          npx --yes @claudinite/setup@1 update --repo . --to "$VERSION" --json > "$RUNNER_TEMP/update.json"
          jq 'del(.log)' "$RUNNER_TEMP/update.json"
          pinned=$(sed -n 's/^  version: "\(.*\)"$/\1/p' .claudinite/settings.yaml | head -n 1)
          if [ "$pinned" != "$VERSION" ]; then
            echo "::error::the update from $FROM pins $pinned, not $VERSION"
            exit 1
          fi
      - name: cn selftest --repo
        working-directory: ${{ runner.temp }}/member
        run: .claudinite/bin/cn selftest --repo .
      - name: no new finding in cn check world
        working-directory: ${{ runner.temp }}/member
        run: |
          .claudinite/bin/cn check world > "$RUNNER_TEMP/after.txt" || true
          cat "$RUNNER_TEMP/after.txt"
          # A run with no finding is a clean one, so grep matching nothing is no error.
          keys() { grep -E '^(break|finding|advisory) ' "$1" | sed 's/: .*//' | sort -u || true; }
          new=$(comm -13 <(keys "$RUNNER_TEMP/before.txt") <(keys "$RUNNER_TEMP/after.txt"))
          if [ -n "$new" ]; then
            echo "::error::cn check world on $VERSION reports findings it did not report on $FROM:"
            echo "$new"
            exit 1
          fi

  report:
    needs: [canary, push-only-ci, encrypted, handover, versions, upgrade]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: open or update the release-blocker issue
        run: |
          title="Release $VERSION fails the empty canary"
          body="The empty canary failed for @claudinite/cli $VERSION: $RUN

          Promotion to stable skips $VERSION while this issue is open. Close it once the failure is understood and either fixed in a later release or judged not to block this one."
          gh label create release-blocker --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description "Holds a release back from promotion to stable"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-blocker --state open --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t)) | first | .number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label release-blocker --body "$body"
          fi
